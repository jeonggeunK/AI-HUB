<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:">
  <title>AI Hub</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5v.01"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></symbol>
      <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4"/><path d="M20 12a8 8 0 0 1-14 5.3"/><path d="M6 21v-4h4"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M7 20h13"/><path d="M4.6 15.4l9.9-9.9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11.6 18.4a2 2 0 0 1-1.4.6H8a2 2 0 0 1-1.4-.6l-2-2a1 1 0 0 1 0-1z"/><path d="M9.5 10.5l5 5"/></symbol>
    </defs>
  </svg>

  <header id="topbar">
    <button id="sidebar-toggle" class="icon" data-sc="sidebar" data-tip="질문 기록{key}" title="질문 기록" aria-label="질문 기록"><svg><use href="#i-history"/></svg></button>
    <nav id="tabs" role="tablist" aria-label="AI 서비스"></nav>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="tools">
      <button id="update-btn" class="toggle update" hidden></button>
      <button id="new-all" class="toggle" data-sc="newChatAll" data-tip="모든 탭을 새 대화로{key} · 한 탭만은 탭의 ＋" title="모든 탭을 새 대화로"><svg><use href="#i-plus"/></svg><span>전체 새 대화</span></button>
      <span class="sep"></span>
      <button class="icon" data-nav="back" data-sc="back" data-tip="뒤로{key}" title="뒤로" aria-label="뒤로"><svg><use href="#i-back"/></svg></button>
      <button class="icon" data-nav="forward" data-sc="forward" data-tip="앞으로{key}" title="앞으로" aria-label="앞으로"><svg><use href="#i-fwd"/></svg></button>
      <button class="icon" data-nav="reload" data-sc="reload" data-tip="새로고침{key}" title="새로고침" aria-label="새로고침"><svg><use href="#i-reload"/></svg></button>
      <button id="zoom" class="chip" data-sc="zoomReset" data-tip="클릭하면 100%로{key}" title="클릭하면 100%로">100%</button>
      <span class="sep"></span>
      <div class="split-group">
        <button id="split" class="toggle" data-sc="split" data-tip="분할 화면{key}" title="분할 화면"><svg><use href="#i-split"/></svg><span>분할</span></button>
        <button id="split-menu" class="toggle caret" title="분할할 서비스 선택" aria-label="분할할 서비스 선택"><svg><use href="#i-caret"/></svg></button>
      </div>
      <button id="broadcast-toggle" class="toggle" data-sc="broadcast" data-tip="동시 질문{key}" title="동시 질문"><svg><use href="#i-chat"/></svg><span>동시 질문</span></button>
      <span class="sep"></span>
      <button id="pin" class="icon" title="항상 위에 고정" aria-label="항상 위에 고정"><svg><use href="#i-pin"/></svg></button>
      <button id="help-btn" class="icon" data-sc="help" data-tip="사용 안내{key}" title="사용 안내" aria-label="사용 안내"><svg><use href="#i-help"/></svg></button>
      <button id="settings-btn" class="icon" data-sc="settings" data-tip="설정{key}" title="설정" aria-label="설정"><svg><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <aside id="sidebar" hidden aria-label="질문 기록">
    <div class="side-head">
      <span class="side-title">질문 기록</span>
      <button id="side-close" class="icon small" data-sc="sidebar" data-tip="닫기{key}" title="닫기" aria-label="질문 기록 닫기"><svg><use href="#i-close"/></svg></button>
    </div>
    <label class="side-search">
      <svg><use href="#i-search"/></svg>
      <input id="side-q" type="search" placeholder="기록 검색" autocomplete="off">
    </label>
    <ol id="side-list"></ol>
  </aside>

  <section id="broadcast" hidden aria-label="동시 질문">
    <div id="bc-resize" class="bc-resize" role="separator" aria-orientation="horizontal" aria-label="입력창 크기 조절" tabindex="0"
         title="위아래로 드래그해서 크기 조절 · 더블클릭하면 자동 크기"></div>
    <div class="bc-head">
      <div id="bc-targets" role="group" aria-label="보낼 서비스"></div>
      <label class="opt" title="각 서비스에서 새 대화를 열고 질문합니다">
        <input type="checkbox" id="bc-newchat"> 새 대화로
      </label>
      <span id="bc-result" role="status" aria-live="polite"></span>
      <button id="bc-new-all" class="btn small-btn" data-sc="newChatAll" data-tip="모든 탭을 새 대화로{key}" title="모든 탭을 새 대화로"><svg><use href="#i-plus"/></svg> 전체 새 대화</button>
      <button id="bc-close" class="icon small" title="닫기 (Esc)" aria-label="동시 질문 닫기"><svg><use href="#i-close"/></svg></button>
    </div>
    <div id="bc-files" class="bc-files" hidden aria-label="첨부 파일"></div>
    <div class="composer">
      <button id="bc-attach" class="icon attach" title="파일·이미지 첨부 (끌어다 놓기·붙여넣기도 가능)" aria-label="파일 첨부"><svg><use href="#i-clip"/></svg></button>
      <textarea id="bc-text" rows="1" spellcheck="false" placeholder="여러 AI에게 한 번에 물어보세요"></textarea>
      <button id="bc-clear" class="icon clear" title="입력·첨부 모두 지우기" aria-label="입력 내용과 첨부 모두 지우기" hidden><svg><use href="#i-eraser"/></svg></button>
      <button id="bc-send" class="send" title="전송" aria-label="전송"><svg><use href="#i-send"/></svg></button>
    </div>
    <div class="bc-foot">
      <span id="bc-hint"></span>
      <span id="bc-count"></span>
    </div>
  </section>

  <div id="modal" hidden>
    <div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" hidden></div>
    <div id="login-guide" class="welcome" role="dialog" aria-modal="true" aria-labelledby="guide-title" aria-live="polite" hidden></div>
    <div class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <aside>
        <h2 id="settings-title">설정</h2>
        <nav id="settings-nav">
          <button data-section="general">일반</button>
          <button data-section="broadcast">동시 질문</button>
          <button data-section="accounts">서비스 · 계정</button>
          <button data-section="coding">코딩</button>
          <button data-section="shortcuts">단축키</button>
          <button data-section="about">정보</button>
        </nav>
      </aside>
      <div class="settings-main">
        <button id="settings-close" class="icon close" title="닫기 (Esc)" aria-label="설정 닫기"><svg><use href="#i-close"/></svg></button>
        <div id="settings-body"></div>
      </div>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
